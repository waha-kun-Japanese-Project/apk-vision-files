version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - vision-network

  vision-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vision-service:latest
    container_name: vision-service
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - MODEL_PATH=./models/efficientnet_waha_kun.keras
      - CONFIDENCE_THRESHOLD=50.0
      - UPLOAD_FOLDER=./uploads
      - MAX_FILE_SIZE=10485760
      - QUALITY_CHECK_ENABLED=true
      - ENHANCE_IMAGE_ENABLED=true
    volumes:
      - ./models:/app/models
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vision-network

networks:
  vision-network:
    driver: bridge

volumes:
  rabbitmq_data: